name: Devin CI Fix (Optional)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  devin-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Start Devin CI-fix session
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload = {
              "prompt": (
                  "Inspect the failed CI run for this repository. Reproduce the failure, "
                  "identify the root cause, implement the smallest correct fix, add or update tests, "
                  "run the relevant checks, and open a focused PR. Do not weaken or delete tests. "
                  f"Failed workflow run id: {os.environ['RUN_ID']}"
              ),
              "org_id": os.environ["DEVIN_ORG_ID"],
              "repository": os.environ["GITHUB_REPOSITORY"],
          }
          req = urllib.request.Request(
              "https://api.devin.ai/v3/sessions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['DEVIN_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print(r.read().decode())
          PY
